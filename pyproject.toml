[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cubo"
version = "0.2.0"
description = "Assistente de voz open source em português, integrado ao Home Assistant."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "faster-whisper>=1.2",
    "google-genai>=3.3",
    "httpx2>=2.16",
    "huggingface-hub>=1.0",
    "livekit-wakeword>=2.1",
    "numpy>=2.0",
    "openai>=3.50",
    "piper-tts>=1.8",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "sounddevice>=0.5",
    "soxr>=1.0",
    "tomli-w>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cubo = "cubo.__main__:main"

[tool.setuptools.packages.find]
include = ["cubo*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
